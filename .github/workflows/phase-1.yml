name: Phase 1 checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [feature/phase-1-optical-foundation]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
